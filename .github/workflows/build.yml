name: Build GLR Collector

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

# Grant permission to create releases
permissions:
  contents: write

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STAP 1: Install Platypus (The Official Way)
      - name: Install Platypus
        uses: sveinbjornt/setup-platypus@master
        with:
          version: '5.5.0'

      # STAP 2: Generate Apple Icon (.icns)
      - name: Generate Icon
        run: |
          mkdir -p MyIcon.iconset
          sips -s format png app.ico --out temp_icon.png
          sips -z 16 16     temp_icon.png --out MyIcon.iconset/icon_16x16.png
          sips -z 32 32     temp_icon.png --out MyIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     temp_icon.png --out MyIcon.iconset/icon_32x32.png
          sips -z 64 64     temp_icon.png --out MyIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   temp_icon.png --out MyIcon.iconset/icon_128x128.png
          sips -z 256 256   temp_icon.png --out MyIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   temp_icon.png --out MyIcon.iconset/icon_256x256.png
          sips -z 512 512   temp_icon.png --out MyIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   temp_icon.png --out MyIcon.iconset/icon_512x512.png
          sips -z 1024 1024 temp_icon.png --out MyIcon.iconset/icon_512x512@2x.png
          iconutil -c icns MyIcon.iconset
          rm temp_icon.png

      # STAP 3: Build Application
      # We use the flags we defined earlier:
      # -D : Droppable (Crucial for drag & drop support)
      # -o 'Progress Bar' : Shows progress bar
      # -i : Icon path
      # -I : Bundle ID
      - name: Build App
        run: |
          chmod +x assignment-collector.sh
          
          platypus \
            -D \
            -o 'Progress Bar' \
            -i 'MyIcon.icns' \
            -y \
            -a 'GLR Collector' \
            -I 'nl.glr.assignmentcollector' \
            'assignment-collector.sh' \
            'GLR Collector.app'

      # Ad-Hoc Code Sign to prevent 'Killed: 9' on Apple Silicon
      - name: Ad-Hoc Code Sign
        run: codesign --force --deep -s - 'GLR Collector.app'

      # STAP 4: Create DMG Image (More native for macOS)
      - name: Create DMG
        run: |
          hdiutil create -volname "GLR Collector" -srcfolder "GLR Collector.app" -ov -format UDZO "GLR_Collector.dmg"

      # STAP 5: Upload Artifact (For testing)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLR-Collector-Build-DMG
          path: GLR_Collector.dmg
          retention-days: 5

      # STAP 6: Create Release (Only on tag push)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GLR_Collector.dmg